field_guide:
  entity: "Synthesizable RTL entity name"
  path: "Path to the synthesizable RTL source file"
  subsystem: "High-level repo grouping used for rollout and sharding"
  tier: "One of functional_python, smoke_python, wrapper_required, deferred_vendor_heavy"
  status: "Implementation state for this inventory row"
  priority: "Rollout priority; pilot marks the initial implementation set"
  wrapper_path: "Optional VHDL wrapper/shim used for cocotb access"
  python_test: "Planned or implemented Python regression entrypoint"
  reference_assets: "Legacy assets worth mining for intent, not preserving as execution requirements"
  notes: "Short implementation notes"
  deferred_reason: "Required when tier is deferred_vendor_heavy"

inventory_rules:
  - "Every synthesizable RTL entity should eventually appear exactly once in this inventory."
  - "Executable regression logic must live in Python."
  - "VHDL may remain only as thin wrappers, shims, or required simulation models."
  - "Legacy VHDL testbenches are reference material, not a preservation target."
  - "Generic-heavy modules should prefer functional_python over smoke_python when actively implemented."

