<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="300" viewBox="0 0 1240 300">
  <style>
    .title { font: 700 22px Arial, sans-serif; fill: #0b2545; }
    .label { font: 600 14px Arial, sans-serif; fill: #0b2545; }
    .text { font: 12px Arial, sans-serif; fill: #18324a; }
    .small { font: 12px Arial, sans-serif; fill: #35516d; }
    .box { stroke: #16324f; stroke-width: 2; rx: 8; ry: 8; }
    .arrow { stroke: #16324f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .side { stroke: #6d4c0f; stroke-width: 2; fill: none; marker-end: url(#sideArrow); stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16324f"/>
    </marker>
    <marker id="sideArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6d4c0f"/>
    </marker>
  </defs>

  <text x="32" y="34" class="title">PGP4 Receive Pipeline</text>

  <rect x="30" y="92" width="150" height="72" class="box" fill="#efe9ff"/>
  <text x="105" y="120" text-anchor="middle" class="label">PHY Words</text>
  <text x="105" y="142" text-anchor="middle" class="text">data plus header</text>

  <rect x="220" y="92" width="170" height="72" class="box" fill="#d9f0ff"/>
  <text x="305" y="120" text-anchor="middle" class="label">Gearbox Aligner</text>
  <text x="305" y="142" text-anchor="middle" class="text">locks on 01 / 10</text>

  <rect x="430" y="92" width="160" height="72" class="box" fill="#f8dff0"/>
  <text x="510" y="120" text-anchor="middle" class="label">Descrambler</text>
  <text x="510" y="142" text-anchor="middle" class="text">valid only when locked</text>

  <rect x="630" y="92" width="190" height="72" class="box" fill="#fff2c8"/>
  <text x="725" y="120" text-anchor="middle" class="label">RX Elastic Buffer</text>
  <text x="725" y="142" text-anchor="middle" class="text">clock crossing, SKP filter</text>

  <rect x="860" y="92" width="170" height="72" class="box" fill="#fde2d5"/>
  <text x="945" y="120" text-anchor="middle" class="label">RX Protocol</text>
  <text x="945" y="142" text-anchor="middle" class="text">LINKINFO and linkReady</text>

  <rect x="1070" y="92" width="140" height="72" class="box" fill="#e8f6df"/>
  <text x="1140" y="120" text-anchor="middle" class="label">Depacketizer</text>
  <text x="1140" y="142" text-anchor="middle" class="text">CRC and sequence</text>

  <path d="M180 128 L210 128" class="arrow"/>
  <path d="M390 128 L420 128" class="arrow"/>
  <path d="M590 128 L620 128" class="arrow"/>
  <path d="M820 128 L850 128" class="arrow"/>
  <path d="M1030 128 L1060 128" class="arrow"/>

  <path d="M725 164 L725 218 L840 218" class="side"/>
  <text x="750" y="210" class="small">RemoteLinkData sideband</text>

  <path d="M725 92 L725 58 L880 58" class="side"/>
  <text x="742" y="54" class="small">bad CSC and overflow report local RX errors</text>

  <text x="92" y="210" class="small">invalid headers are rejected before descrambling</text>
  <text x="414" y="210" class="small">SKP does not reach protocol state</text>
  <text x="910" y="210" class="small">valid SOF/SOC/IDLE refresh link state</text>
</svg>
