# The following environment variables are required for this process:
# secrets.GH_TOKEN

name: CI
# Triggers: feature-branch pushes run a selective (path-mapped) RTL regression;
# pushes to pre-release, main, and tags, and PRs into main, run it in full.
# Manual dispatch can simulate a changed-path list for selective mode.
# Concurrency groups are keyed by event and ref so push, PR, and manual runs
# never cancel one another.
#
# RTL and Rogue regressions are separate jobs because Rogue is conda-only
# (conda-forge slac-rogue) and every Rogue test skips silently without it, so
# the Rogue job is the one place those tests are required to run.
on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      changed_files_override:
        description: Comma-separated paths used to exercise selective CI without changing push/PR policy
        required: false
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

# ----------------------------------------------------------------------------
  lint:
    name: Linting
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pip tclsh ghdl
          python -m pip install --upgrade pip
          python -m pip install -r pip_requirements.txt
          if [ -L ruckus ] && [ ! -d ruckus ]; then
            echo "Removing broken ruckus symlink from checkout"
            rm ruckus
          fi
          if [ ! -d ruckus ]; then
            git clone https://github.com/slaclab/ruckus.git ruckus
          fi
          python -m pip install -r ruckus/scripts/pip_requirements.txt

      - name: Check for trailing whitespace and tabs
        run: |
          if grep -rnI '[[:blank:]]$' --include=\*.{vhd,tcl,py} .; then
            echo "Error: Trailing whitespace found in the repository!"
            exit 1
          fi

          if grep -rnI $'\t' --include=\*.{vhd,tcl,py} .; then
            echo "Error: Tab characters found in the repository! Please use spaces for indentation."
            exit 1
          fi

      - name: Check for non-ASCII characters in VHDL
        run: |
          if LC_ALL=C grep -rnP '[^\x00-\x7F]' --include=\*.vhd .; then
            echo "Error: Non-ASCII characters found in VHDL source! Some tools (e.g. Cadence Genus) read VHDL with an ASCII codec and will fail. Please use plain ASCII (e.g. '-' instead of en/em dashes)."
            exit 1
          fi

      - name: Python Linter Checking
        run: |
          python -m compileall -f python/ scripts/ tests/
          flake8 --count python/ scripts/ tests/

      - name: C/C++ Linter Checking
        run: |
          find . -name '*.h' -o -name '*.cpp' -o -name '*.c' | xargs cpplint

      - name: VHDL Linter Checking
        run: |
          source scripts/vsg_linter.sh

      - name: VHDL Syntax Checking
        run: |
          make MODULES=$PWD analysis

# ----------------------------------------------------------------------------
  test:
    name: "RTL test: ${{ matrix.module }}"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        module: [axi, base, common, devices, dsp, ethernet, protocols, simlink, xilinx]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 python3-pip tclsh ghdl libzmq3-dev valgrind iverilog verilator
          python -m pip install --upgrade pip
          python -m pip install -r pip_requirements.txt
          if [ -L ruckus ] && [ ! -d ruckus ]; then
            echo "Removing broken ruckus symlink from checkout"
            rm ruckus
          fi
          if [ ! -d ruckus ]; then
            git clone https://github.com/slaclab/ruckus.git ruckus
          fi
          python -m pip install -r ruckus/scripts/pip_requirements.txt

      - name: Verify Icarus and Verilator
        # Fail early on a missing or too-old simulator; the Icarus and
        # Verilator suites would otherwise pass as silent skips.
        run: |
          iverilog -V
          verilator --version
          python -c "import sys, tests.simlink.iverilog.iverilog_test_utils as iu, tests.simlink.verilator.verilator_test_utils as vu; sys.exit(None if iu.tools_available() and vu.tools_available() else iu.SKIP_REASON + '; ' + vu.SKIP_REASON)"

      - name: Determine run mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] \
             || [[ "${{ github.ref }}" == "refs/heads/main" ]] \
             || [[ "${{ github.ref }}" == "refs/heads/pre-release" ]] \
             || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=selective" >> "$GITHUB_OUTPUT"
          fi

      - name: Regression Tests
        env:
          MODULE: ${{ matrix.module }}
          CHANGED_FILES_OVERRIDE: ${{ inputs.changed_files_override }}
        run: |
          targets=("tests/${MODULE}")

          # Selective mode keeps this module's share of the path selector
          # output. tests/common (selector policy tests) and tests/simlink (no
          # path maps to it) always run in full. FORCE_FULL or a selector
          # error runs the whole module.
          if [[ "${{ steps.mode.outputs.value }}" == "selective" ]] \
             && [[ "${MODULE}" != "common" ]] && [[ "${MODULE}" != "simlink" ]]; then
            selector_args=()
            selection_source="git diff against origin/pre-release"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
               && [[ -n "${CHANGED_FILES_OVERRIDE}" ]]; then
              selector_args+=(--changed-files-override "${CHANGED_FILES_OVERRIDE}")
              selection_source="manual changed-path simulation"
            fi

            if selector_output="$(python -m tests.common "${selector_args[@]}")"; then
              selector_rc=0
            else
              selector_rc=$?
            fi
            echo "${selector_output}"

            if [[ "${selector_rc}" -ne 0 ]] || grep -qx "FORCE_FULL" <<< "${selector_output}"; then
              result="full ${MODULE} regression (selector rc=${selector_rc})"
            else
              mapfile -t targets < <(grep -E "^tests/${MODULE}(/|$)" <<< "${selector_output}" || true)
              result="selective, pytest targets: ${targets[*]:-none}"
            fi
            {
              echo "### Regression selection: ${MODULE}"
              echo
              echo "- Source: ${selection_source}"
              echo "- Result: ${result}"
            } >> "${GITHUB_STEP_SUMMARY}"

            if [[ "${#targets[@]}" -eq 0 ]]; then
              echo "No selected targets for ${MODULE}; nothing to run."
              exit 0
            fi
          fi

          # The cocotb runner and the compliance audit read build/SRC_VHDL.
          make MODULES=$PWD import
          if [[ "${MODULE}" == "common" ]]; then
            python -m tests.common.compliance_audit check tests
          fi

          # Full runs collect the coverage uploaded to Codecov.
          cov=()
          if [[ "${{ steps.mode.outputs.value }}" == "full" ]]; then
            cov=(--cov)
          fi

          # Cap SimLink at min(nproc, 8): an unbounded -n auto on a many-core
          # runner starves its multi-instance ZeroMQ peer handshake.
          workers=auto
          if [[ "${MODULE}" == "simlink" ]]; then
            workers="$(python -c 'import os; print(min(os.cpu_count() or 1, 8))')"
          fi

          python -m pytest "${cov[@]}" -v -n "${workers}" --dist=worksteal "${targets[@]}"

      - name: Code Coverage
        if: steps.mode.outputs.value == 'full'
        run: |
          codecov
          coverage report -m

# ----------------------------------------------------------------------------

  rogue_test:
    name: Rogue Regression Tests
    # Every suite that needs a real Rogue install runs here, against the
    # conda-forge slac-rogue release pinned in conda-rogue.yml.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: surf-rogue-test
          environment-file: conda-rogue.yml
          auto-activate: false
          conda-remove-defaults: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tclsh ghdl pkg-config libzmq3-dev iverilog verilator
          python -m pip install --upgrade pip
          python -m pip install -r pip_requirements.txt
          if [ -L ruckus ] && [ ! -d ruckus ]; then
            echo "Removing broken ruckus symlink from checkout"
            rm ruckus
          fi
          if [ ! -d ruckus ]; then
            git clone https://github.com/slaclab/ruckus.git ruckus
          fi
          python -m pip install -r ruckus/scripts/pip_requirements.txt

      - name: Verify Rogue
        # Fail early if the conda environment did not activate; a missing
        # Rogue would turn every suite below into a silent skip.
        run: |
          python -c "import rogue, pyrogue; print(rogue.Version.current())"

      - name: Verify Icarus and Verilator
        # Fail early on a missing or too-old simulator; the Icarus and
        # Verilator Rogue contracts would otherwise pass as silent skips.
        run: |
          iverilog -V
          verilator --version
          python -c "import sys, tests.simlink.iverilog.iverilog_test_utils as iu, tests.simlink.verilator.verilator_test_utils as vu; sys.exit(None if iu.tools_available() and vu.tools_available() else iu.SKIP_REASON + '; ' + vu.SKIP_REASON)"

      - name: Import HDL sources
        # The SimLink contracts build from build/SRC_VHDL.
        run: |
          make MODULES="$PWD" import

      - name: Determine run mode
        # Same policy as the RTL matrix. The Rogue suite always runs in full;
        # the mode only decides whether coverage is collected and uploaded.
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] \
             || [[ "${{ github.ref }}" == "refs/heads/main" ]] \
             || [[ "${{ github.ref }}" == "refs/heads/pre-release" ]] \
             || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=selective" >> "$GITHUB_OUTPUT"
          fi

      - name: Rogue Tests
        # SIMLINK_ROGUE_PYTHON points the SimLink contracts at the conda Rogue.
        # PYTHONPATH makes the PyRogue suites exercise the in-repo python/surf
        # model rather than an installed surf. Use one worker per logical CPU,
        # capped at 8 like the simlink RTL leg: -n auto counts physical cores
        # (2 on the 4-vCPU hosted runner).
        run: |
          # Full runs collect the coverage uploaded to Codecov.
          cov=()
          if [[ "${{ steps.mode.outputs.value }}" == "full" ]]; then
            cov=(--cov)
          fi

          workers="$(python -c 'import os; print(min(os.cpu_count() or 1, 8))')"
          SIMLINK_ROGUE_PYTHON="$(command -v python)" PYTHONPATH="$PWD/python" \
            python -m pytest "${cov[@]}" -v -n "${workers}" --dist=worksteal \
              tests/simlink/rogue \
              tests/devices/analog_devices/test_AdcDdrCalibration.py \
              tests/devices/analog_devices/test_AdcDdrModel.py \
              tests/devices/micron/test_DdrSpd.py \
              tests/devices/micron/test_Tse2004av.py \
              tests/devices/silabs/test_Si570.py \
              tests/axi/axi_lite/test_AxiLiteMasterProxyRogue.py \
              tests/devices/transceivers/test_QsfpRogue.py \
              tests/xilinx/eyescan

      - name: Code Coverage
        if: steps.mode.outputs.value == 'full'
        run: |
          codecov
          coverage report -m

# ----------------------------------------------------------------------------

  docs:
    name: Documentation
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen doxygen-doc doxygen-latex doxygen-gui graphviz

      - name: Generate Documentation
        run: |
          doxygen Doxyfile

      - name: Deploy Documentation
        if: startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: doxygen/html

# ----------------------------------------------------------------------------

  gen_release:
    needs: [lint, test, rogue_test, docs]
    if: startsWith(github.ref, 'refs/tags/')
    uses: slaclab/ruckus/.github/workflows/gen_release.yml@main
    with:
      version: '1.0.0'
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

# ----------------------------------------------------------------------------
