<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1080" role="img" aria-labelledby="title description">
  <title id="title">Proposed Ethernet PTP endpoint architecture</title>
  <desc id="description">One instance of each block is shown. EthMacPtpEndpoint contains EthMacTop, a passive GMII or XGMII timestamp tap, and PtpEndpoint. PtpEndpoint contains PtpPort, PtpServo, PtpReg, a command selector, and PtpPhc. Primary application frames pass through the MAC to an external PCS/PMA. Private bypass frames and keyed timestamp events meet at PtpPort; their association after MAC drops remains a design gate. The PHC drives capture time and application time. Register configuration, status, clocks, and resets are specified fully in the adjacent README interface table.</desc>
  <defs>
    <marker id="packetArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155"/></marker>
    <marker id="eventArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45309"/></marker>
    <marker id="timeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#007c83"/></marker>
    <marker id="controlArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6d4bb5"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #172b44; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526174; }
      .groupTitle { font-size: 21px; font-weight: 650; }
      .groupNote { font-size: 16px; fill: #526174; }
      .blockTitle { font-size: 22px; font-weight: 650; text-anchor: middle; }
      .detail { font-size: 17px; fill: #526174; text-anchor: middle; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 16px; fill: #526174; }
      .box { fill: #fff; stroke: #9aa9b9; stroke-width: 1.5; }
      .packet { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#packetArrow); }
      .duplex { marker-start: url(#packetArrow); }
      .event { fill: none; stroke: #b45309; stroke-width: 3; stroke-dasharray: 9 5; marker-end: url(#eventArrow); }
      .time { fill: none; stroke: #007c83; stroke-width: 3; marker-end: url(#timeArrow); }
      .control { fill: none; stroke: #6d4bb5; stroke-width: 2.5; stroke-dasharray: 4 4; marker-end: url(#controlArrow); }
      .eventText { fill: #92400e; }
      .timeText { fill: #006d73; }
      .controlText { fill: #6240a4; }
    </style>
  </defs>

  <rect width="1500" height="1080" fill="#fff"/>
  <text class="title" x="60" y="52">Ethernet PTP endpoint</text>
  <text class="subtitle" x="60" y="84">Proposed composition · one instance per block · common ethClk for capture, protocol, servo, and PHC</text>

  <!-- The optional integration wrapper preserves the primary stream interface. -->
  <rect x="60" y="170" width="1000" height="750" rx="18" fill="#f6f8fb" stroke="#b0bdcc" stroke-width="2"/>
  <text class="groupTitle" x="84" y="205">EthMacPtpEndpoint</text>
  <text class="groupNote" x="720" y="205">Opt-in MAC composition</text>

  <text class="label" x="340" y="130" text-anchor="middle">Primary application AXI Stream</text>
  <path class="packet duplex" d="M 340 145 V 230"/>
  <rect class="box" x="110" y="230" width="490" height="100" rx="10"/>
  <text class="blockTitle" x="355" y="269">EthMacTop</text>
  <text class="detail" x="355" y="299">FIFOs · arbitration · pause · framing · CRC</text>

  <rect class="box" x="1120" y="230" width="320" height="100" rx="10"/>
  <text class="blockTitle" x="1280" y="269">PCS / PMA</text>
  <text class="detail" x="1280" y="299">Family-specific PHY → link</text>
  <path class="packet duplex" d="M 600 275 H 1120"/>
  <text class="label" x="850" y="257" text-anchor="middle">TX / RX GMII or XGMII</text>
  <circle cx="830" cy="275" r="5" fill="#b45309"/>
  <path class="event" d="M 830 280 V 350"/>
  <text class="label eventText" x="847" y="319">Observe</text>

  <rect x="690" y="350" width="270" height="95" rx="10" fill="#fffbf1" stroke="#cc9a55" stroke-width="1.5"/>
  <text class="blockTitle" x="825" y="387">Timestamp tap</text>
  <text class="detail" x="825" y="415">GMII or XGMII · RX + TX</text>
  <text class="label eventText" x="523" y="373" text-anchor="middle">Keyed timestamp events</text>
  <text class="small" x="1120" y="380">Capture at the MAC / PCS plane.</text>
  <text class="small" x="1120" y="406">Translate SFD detection to the</text>
  <text class="small" x="1120" y="432">PTP point immediately after SFD.</text>

  <!-- Only PtpEndpoint owns the port, servo, registers, command selection, and PHC. -->
  <rect x="90" y="470" width="890" height="405" rx="14" fill="#edf2f8" stroke="#9aaec5" stroke-width="1.5"/>
  <text class="groupTitle" x="355" y="502">PtpEndpoint</text>
  <path class="event" d="M 690 395 H 535 V 545 H 430"/>
  <path class="packet duplex" d="M 240 330 V 525"/>
  <rect x="126" y="388" width="228" height="57" rx="7" fill="#f6f8fb"/>
  <text class="label" x="240" y="410" text-anchor="middle">Private PTP TX / RX</text>
  <text class="small" x="240" y="433" text-anchor="middle">Raw L2 bypass · 0x88F7</text>

  <rect x="110" y="525" width="320" height="120" rx="10" fill="#fff" stroke="#cc9a55" stroke-width="2"/>
  <text class="blockTitle" x="270" y="558">PtpPort</text>
  <text class="detail" x="270" y="585">Parse · associate · E2E exchange</text>
  <rect x="125" y="601" width="290" height="29" rx="5" fill="#fff0d7"/>
  <text class="label eventText" x="270" y="621" text-anchor="middle">Key-only join rejected · R3</text>

  <rect class="box" x="690" y="525" width="270" height="120" rx="10"/>
  <text class="blockTitle" x="825" y="564">PtpReg</text>
  <text class="detail" x="825" y="594">Configuration · snapshots</text>
  <text class="detail" x="825" y="620">Manual PHC commands</text>
  <path class="control" d="M 690 585 H 430"/>
  <text class="label controlText" x="565" y="575" text-anchor="middle">Port config</text>

  <rect class="box" x="1120" y="525" width="320" height="120" rx="10"/>
  <text class="blockTitle" x="1280" y="566">AXI-Lite / Rogue</text>
  <text class="detail" x="1280" y="595">Configure and observe</text>
  <text class="detail" x="1280" y="622">Outside the timing loop</text>
  <path class="control" d="M 1120 565 H 1030 Q 1018 547 1006 565 H 960"/>

  <path class="event" d="M 220 645 V 735"/>
  <text class="label eventText" x="235" y="683">Forward delay +</text>
  <text class="label eventText" x="235" y="706">path-delay updates</text>
  <rect class="box" x="110" y="735" width="220" height="90" rx="10"/>
  <text class="blockTitle" x="220" y="772">PtpServo</text>
  <text class="detail" x="220" y="801">Filter · acquire · track</text>

  <rect x="400" y="735" width="180" height="90" rx="10" fill="#f6f2ff" stroke="#a38bc7" stroke-width="1.5"/>
  <text class="blockTitle" x="490" y="772">Selector</text>
  <text class="detail" x="490" y="801">Command / ack</text>
  <path class="control" d="M 330 780 H 400"/>
  <text class="label controlText" x="365" y="764" text-anchor="middle">Auto</text>
  <path class="control" d="M 790 645 V 685 H 490 V 735"/>
  <text class="label controlText" x="621" y="675" text-anchor="middle">Manual</text>
  <path class="control" d="M 580 780 H 690"/>
  <text class="label controlText" x="635" y="764" text-anchor="middle">Selected</text>

  <rect x="690" y="735" width="270" height="90" rx="10" fill="#effafa" stroke="#67a8ac" stroke-width="1.5"/>
  <text class="blockTitle" x="825" y="772">PtpPhc</text>
  <text class="detail" x="825" y="801">Numerically disciplined time</text>
  <path class="time" d="M 960 780 H 1018 V 420 H 960"/>
  <text class="label timeText" x="1040" y="717" transform="rotate(-90 1040 717)">PHC → capture</text>
  <circle cx="1018" cy="780" r="5" fill="#007c83"/>
  <path class="time" d="M 1023 780 H 1120"/>
  <rect x="1120" y="735" width="320" height="90" rx="10" fill="#effafa" stroke="#67a8ac" stroke-width="1.5"/>
  <text class="blockTitle" x="1280" y="772">Application consumers</text>
  <text class="detail" x="1280" y="801">Time / PPS · optional scheduler</text>
  <text class="small" x="1120" y="859">Precise actions remain in phcClk.</text>
  <text class="small" x="1120" y="884">Other domains use explicit CDC.</text>

  <text class="groupNote" x="110" y="854">PtpPkg supplies shared types and arithmetic; it is not an instantiated block.</text>
  <text class="groupNote" x="84" y="902">One PHC per endpoint / lane. Protocol reset and link loss do not imply PHC reset.</text>

  <!-- Line styles retain meaning when the figure is printed without color. -->
  <path class="packet" d="M 70 969 H 125"/>
  <text class="label" x="139" y="975">Packet datapath</text>
  <path class="event" d="M 375 969 H 430"/>
  <text class="label eventText" x="444" y="975">Capture / measurement</text>
  <path class="control" d="M 770 969 H 825"/>
  <text class="label controlText" x="839" y="975">Configuration / command</text>
  <path class="time" d="M 1170 969 H 1225"/>
  <text class="label timeText" x="1239" y="975">PHC time</text>
  <text class="small" x="60" y="1024">For clarity: status/readback, servo configuration, shared localMac, clocks, resets, and handshake returns are omitted.</text>
  <text class="small" x="60" y="1052">The README interface table and reset contracts define those connections. Simulation providers are separate from this hardware composition.</text>
</svg>
