<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470">
  <style>
    .title { font: 700 22px Arial, sans-serif; fill: #0b2545; }
    .label { font: 600 14px Arial, sans-serif; fill: #0b2545; }
    .text { font: 12px Arial, sans-serif; fill: #18324a; }
    .box { stroke: #16324f; stroke-width: 2; rx: 8; ry: 8; }
    .arrow { stroke: #16324f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16324f"/>
    </marker>
  </defs>

  <text x="32" y="34" class="title">Full-Profile TX/RX Data Path</text>

  <text x="160" y="78" text-anchor="middle" class="label">Transmit Direction</text>
  <rect x="30" y="100" width="180" height="66" class="box" fill="#d9f0ff"/>
  <text x="120" y="126" text-anchor="middle" class="label">VC Frame Inputs</text>
  <text x="120" y="148" text-anchor="middle" class="text">up to 16 VCs</text>

  <rect x="250" y="100" width="160" height="66" class="box" fill="#e8f6df"/>
  <text x="330" y="126" text-anchor="middle" class="label">VC Selection</text>
  <text x="330" y="148" text-anchor="middle" class="text">cell interleaving</text>

  <rect x="450" y="100" width="180" height="66" class="box" fill="#fff2c8"/>
  <text x="540" y="126" text-anchor="middle" class="label">Packetizer</text>
  <text x="540" y="148" text-anchor="middle" class="text">cell headers and CRC</text>

  <rect x="670" y="100" width="190" height="66" class="box" fill="#fde2d5"/>
  <text x="765" y="126" text-anchor="middle" class="label">TX Protocol</text>
  <text x="765" y="148" text-anchor="middle" class="text">IDLE, SKP, USER</text>

  <rect x="900" y="100" width="160" height="66" class="box" fill="#f8dff0"/>
  <text x="980" y="126" text-anchor="middle" class="label">Scrambler</text>
  <text x="980" y="148" text-anchor="middle" class="text">64b/66b output</text>

  <rect x="1100" y="100" width="110" height="66" class="box" fill="#efe9ff"/>
  <text x="1155" y="126" text-anchor="middle" class="label">PHY</text>
  <text x="1155" y="148" text-anchor="middle" class="text">serial link</text>

  <text x="160" y="260" text-anchor="middle" class="label">Receive Direction</text>
  <rect x="1100" y="286" width="110" height="66" class="box" fill="#efe9ff"/>
  <text x="1155" y="312" text-anchor="middle" class="label">PHY</text>
  <text x="1155" y="334" text-anchor="middle" class="text">66-bit words</text>

  <rect x="900" y="286" width="160" height="66" class="box" fill="#f8dff0"/>
  <text x="980" y="312" text-anchor="middle" class="label">Descrambler</text>
  <text x="980" y="334" text-anchor="middle" class="text">aligned words</text>

  <rect x="670" y="286" width="190" height="66" class="box" fill="#fde2d5"/>
  <text x="765" y="312" text-anchor="middle" class="label">Elastic Buffer</text>
  <text x="765" y="334" text-anchor="middle" class="text">SKP and error tracking</text>

  <rect x="450" y="286" width="180" height="66" class="box" fill="#fff2c8"/>
  <text x="540" y="312" text-anchor="middle" class="label">RX Protocol</text>
  <text x="540" y="334" text-anchor="middle" class="text">LINKINFO and opcodes</text>

  <rect x="250" y="286" width="160" height="66" class="box" fill="#e8f6df"/>
  <text x="330" y="312" text-anchor="middle" class="label">Depacketizer</text>
  <text x="330" y="334" text-anchor="middle" class="text">CRC and sequence</text>

  <rect x="30" y="286" width="180" height="66" class="box" fill="#d9f0ff"/>
  <text x="120" y="312" text-anchor="middle" class="label">VC Frame Outputs</text>
  <text x="120" y="334" text-anchor="middle" class="text">demux by VC</text>

  <path d="M210 133 L240 133" class="arrow"/>
  <path d="M410 133 L440 133" class="arrow"/>
  <path d="M630 133 L660 133" class="arrow"/>
  <path d="M860 133 L890 133" class="arrow"/>
  <path d="M1060 133 L1090 133" class="arrow"/>

  <path d="M1098 319 L1068 319" class="arrow"/>
  <path d="M898 319 L868 319" class="arrow"/>
  <path d="M668 319 L638 319" class="arrow"/>
  <path d="M448 319 L418 319" class="arrow"/>
  <path d="M248 319 L218 319" class="arrow"/>

  <path d="M540 176 L540 250" class="arrow"/>
  <text x="572" y="216" class="text">metadata feedback</text>
  <text x="572" y="236" class="text">pause, overflow, opcodes</text>
</svg>
